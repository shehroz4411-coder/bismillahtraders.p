<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gallery | Spanish Fast Food</title>

    <link rel="stylesheet" href="spanish.css">
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="gallery-header">

        <a href="menu.html" class="back-btn">
            ← Back
        </a>

        <div>
            <span>SPANISH</span>
            <h1>Our Gallery</h1>
            <p>A taste you can see.</p>
        </div>

    </header>


    <!-- ================= GALLERY ================= -->

    <main class="gallery-container">

        <div class="gallery-grid">

            <div class="gallery-card">
                <img
                    src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=1000&q=85"
                    alt="Burger"
                >
            </div>

            <div class="gallery-card">
                <img
                    src="https://images.unsplash.com/photo-1579751626657-72bc17010498?auto=format&fit=crop&w=1000&q=85"
                    alt="Pizza"
                >
            </div>

            <div class="gallery-card">
                <img
                    src="https://images.unsplash.com/photo-1521305916504-4a1121188589?auto=format&fit=crop&w=1000&q=85"
                    alt="French Fries"
                >
            </div>

            <div class="gallery-card">
                <img
                    src="https://images.unsplash.com/photo-1600891964092-4316c288032e?auto=format&fit=crop&w=1000&q=85"
                    alt="Restaurant Food"
                >
            </div>

            <div class="gallery-card">
                <img
                    src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?auto=format&fit=crop&w=1000&q=85"
                    alt="Pizza"
                >
            </div>

            <div class="gallery-card">
                <img
                    src="https://images.unsplash.com/photo-1563379926898-05f4575a45d8?auto=format&fit=crop&w=1000&q=85"
                    alt="Pasta"
                >
            </div>

            <div class="gallery-card">
                <img
                    src="https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=1000&q=85"
                    alt="Food"
                >
            </div>

            <div class="gallery-card">
                <img
                    src="https://images.unsplash.com/photo-1513104890138-7c749659a591?auto=format&fit=crop&w=1000&q=85"
                    alt="Pizza"
                >
            </div>

            <div class="gallery-card">
                <img
                    src="https://images.unsplash.com/photo-1551024506-0bccd828d307?auto=format&fit=crop&w=1000&q=85"
                    alt="Dessert"
                >
            </div>

        </div>

    </main>


    <!-- ================= LIGHTBOX ================= -->

    <div class="lightbox" id="lightbox">

        <button class="close-lightbox" id="closeLightbox">
            ×
        </button>

        <button class="lightbox-prev" id="prevImage">
            ‹
        </button>

        <img id="lightboxImage" src="" alt="Gallery Image">

        <button class="lightbox-next" id="nextImage">
            ›
        </button>

    </div>


    <!-- ================= JS ================= -->

    <script>

        const galleryImages =
            document.querySelectorAll(".gallery-card img");

        const lightbox =
            document.getElementById("lightbox");

        const lightboxImage =
            document.getElementById("lightboxImage");

        const closeLightbox =
            document.getElementById("closeLightbox");

        const nextImage =
            document.getElementById("nextImage");

        const prevImage =
            document.getElementById("prevImage");


        let currentImage = 0;


        function openGallery(index) {

            currentImage = index;

            lightboxImage.src =
                galleryImages[currentImage].src;

            lightbox.classList.add("active");

            document.body.classList.add("no-scroll");

        }


        function closeGallery() {

            lightbox.classList.remove("active");

            document.body.classList.remove("no-scroll");

        }


        function showNext() {

            currentImage++;

            if (
                currentImage >=
                galleryImages.length
            ) {
                currentImage = 0;
            }

            lightboxImage.src =
                galleryImages[currentImage].src;

        }


        function showPrevious() {

            currentImage--;

            if (currentImage < 0) {
                currentImage =
                    galleryImages.length - 1;
            }

            lightboxImage.src =
                galleryImages[currentImage].src;

        }


        galleryImages.forEach(
            (image, index) => {

                image.addEventListener(
                    "click",
                    () => {

                        openGallery(index);

                    }
                );

            }
        );


        closeLightbox.addEventListener(
            "click",
            closeGallery
        );


        nextImage.addEventListener(
            "click",
            showNext
        );


        prevImage.addEventListener(
            "click",
            showPrevious
        );


        lightbox.addEventListener(
            "click",
            event => {

                if (
                    event.target === lightbox
                ) {

                    closeGallery();

                }

            }
        );


        document.addEventListener(
            "keydown",
            event => {

                if (
                    !lightbox.classList.contains(
                        "active"
                    )
                ) {
                    return;
                }


                if (event.key === "Escape") {
                    closeGallery();
                }


                if (event.key === "ArrowRight") {
                    showNext();
                }


                if (event.key === "ArrowLeft") {
                    showPrevious();
                }

            }
        );

    </script>

</body>
</html>
